<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Kameramera logo: a stickman in a Kamehameha pose with a camera between his palms">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7DE3FF" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#2BB6F5" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2BB6F5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2A4A"/>
      <stop offset="1" stop-color="#0B1226"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="48" fill="url(#bg)"/>

  <!-- energy glow behind the camera -->
  <circle cx="180" cy="122" r="70" fill="url(#glow)"/>

  <!-- energy rays -->
  <g stroke="#7DE3FF" stroke-width="5" stroke-linecap="round" opacity="0.9">
    <line x1="222" y1="122" x2="244" y2="122"/>
    <line x1="216" y1="98" x2="236" y2="86"/>
    <line x1="216" y1="146" x2="236" y2="158"/>
  </g>

  <!-- stickman -->
  <g stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="80" cy="86" r="15" fill="#0B1226"/>
    <!-- torso -->
    <line x1="82" y1="104" x2="74" y2="160"/>
    <!-- arms extended forward, hands meeting at the camera -->
    <line x1="80" y1="114" x2="152" y2="116"/>
    <line x1="79" y1="120" x2="152" y2="130"/>
    <!-- wide stance legs -->
    <polyline points="74,160 106,182 104,208"/>
    <line x1="74" y1="160" x2="46" y2="208"/>
  </g>

  <!-- camera -->
  <g>
    <rect x="152" y="96" width="56" height="44" rx="9" fill="#FFC83D" stroke="#0B1226" stroke-width="4"/>
    <rect x="164" y="88" width="18" height="10" rx="3" fill="#FFC83D" stroke="#0B1226" stroke-width="4"/>
    <circle cx="180" cy="119" r="16" fill="#0B1226"/>
    <circle cx="180" cy="119" r="10" fill="#2BB6F5"/>
    <circle cx="176" cy="115" r="3" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="198" cy="106" r="3" fill="#FF5A5F"/>
  </g>
</svg>
